<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <div class="logo">MYNTRA</div>

    <h2>🛒 My Cart</h2>

    <a href="index.html" class="login-btn">Back to Home</a>

</header>

<section class="products">

    <div class="card">
        <img src="image/tshirt.jpg" alt="T-Shirt">
        <h3>T-Shirt</h3>
        <p>₹1499</p>
        <button>Remove</button>
    </div>

    <div class="card">
        <img src="image/shoes.jpg" alt="Shoes">
        <h3>Shoes</h3>
        <p>₹1999</p>
        <button>Remove</button>
    </div>

    <div class="card">
        <img src="image/jeans.jpg" alt="Jeans">
        <h3>Jeans</h3>
        <p>₹3000</p>
        <button>Remove</button>
    </div>

    <div class="card">
        <img src="image/belt.jpg" alt="Belt">
        <h3>Belt</h3>
        <p>₹1000</p>
        <button>Remove</button>
    </div>

</section>

<section class="cta">

    <h2>Order Summary</h2>

    <br>

    <p>Subtotal : ₹7498</p>

    <p>Delivery Charges : <b>FREE</b></p>

    <p>Discount : ₹500</p>

    <hr style="margin:20px 0;">

    <h2>Total Amount : ₹6998</h2>

    <br>

    <a href="placeorder.html">
        <button>Place Order</button>
    </a>

</section>

<script src="script.js"></script>

</body>
</html>
