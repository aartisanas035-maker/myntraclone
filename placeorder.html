<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-container">

    <div class="login-content">

        <h2>Place Your Order</h2>

        <input type="text" placeholder="Full Name" required>

        <br><br>

        <input type="tel" placeholder="Mobile Number" required>

        <br><br>

        <input type="email" placeholder="Email Address" required>

        <br><br>

        <textarea placeholder="Delivery Address" rows="4"
        style="width:100%;padding:12px;border:1px solid #ccc;border-radius:5px;font-size:16px;"></textarea>

        <br><br>

        <input type="text" placeholder="City" required>

        <br><br>

        <input type="text" placeholder="Pincode" required>

        <br><br>

        <h3>Payment Method</h3>

        <br>

        <input type="radio" name="payment"> Cash On Delivery

        <br><br>

        <input type="radio" name="payment"> UPI

        <br><br>

        <input type="radio" name="payment"> Credit / Debit Card

        <br><br>

        <h3>Total Amount : ₹6998</h3>

        <br>

        <a href="success.html">
            <button style="width:100%;">Confirm Order</button>
        </a>

        <a href="cart.html" class="back-home">
            ← Back to Cart
        </a>

    </div>

</div>

</body>
</html>
